<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGH plan</title>
<style>
:root {
  --bg: #0d0f14; --panel: #141821; --raise: #1b202b; --raise2: #222836; --line: #2a303d; --line2: #3a4252;
  --text: #e7e9ef; --muted: #8a92a6; --accent: #6aa9ff; --warn: #f59e0b; --bad: #ef4444;
  --idea: #a78bfa; --todo: #6b7280; --doing: #3b82f6; --blocked: #ef4444; --done: #22c55e;
  --p-now: #fb923c; --p-next: #facc15; --p-later: #38bdf8; --p-someday: #94a3b8;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
body { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 1fr 360px; height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer;
  transition: border-color .15s, background .15s, color .15s; }
button:hover { border-color: var(--line2); background: var(--raise2); }
button.on { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .35; cursor: default; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%;
  transition: border-color .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input[type=checkbox] { width: auto; accent-color: var(--done); }
input[type=color] { padding: 0 2px; height: 28px; width: 34px; flex: none; }
kbd { background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, monospace; color: var(--muted); }
code { font: 12px ui-monospace, monospace; background: var(--raise); padding: 0 4px; border-radius: 3px; }
.muted { color: var(--muted); }

/* ---------- header ---------- */
header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 14px; margin: 0 6px 0 0; font-weight: 650; letter-spacing: .02em; }
header .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
header #search { width: 190px; }
header .grp { display: flex; gap: 6px; align-items: center; }
.seg { display: flex; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: 6px 0 0 6px; }
.seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
#save { margin-left: auto; color: var(--muted); font-size: 12px; min-width: 70px; text-align: right; transition: color .2s; }
#save.bad { color: var(--bad); } #save.warn { color: var(--warn); }
body[data-view=list] .tree-only, body[data-view=tree] .list-only { display: none; }

#banner { grid-column: 1 / 3; grid-row: 2; display: none; gap: 8px; align-items: center; padding: 7px 12px; background: #3a2a0c; border-bottom: 1px solid var(--warn); }
#banner.show { display: flex; }

/* ---------- tree canvas ---------- */
#main { grid-row: 3; grid-column: 1; position: relative; overflow: hidden; }
#stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background-image: radial-gradient(circle, #ffffff12 1px, transparent 1.3px); }
#stage.panning { cursor: grabbing; }
#stage.glide { transition: background-position .3s var(--ease), background-size .3s var(--ease); }
body[data-view=list] #stage, body[data-view=tree] #list { display: none; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world.glide { transition: transform .3s var(--ease); }
#svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: #39404f; stroke-width: 1.5; }
.dep { fill: none; stroke: var(--warn); stroke-width: 1.3; stroke-dasharray: 4 4; opacity: .2; transition: opacity .2s; }
.dep.hot { opacity: .95; stroke-width: 1.7; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); pointer-events: none; }
#empty button { pointer-events: auto; }
#empty[hidden] { display: none; }

.node { position: absolute; left: 0; top: 0; width: 156px; height: 52px; padding: 5px 8px 0; background: var(--raise);
  border: 1px solid var(--line); border-top: 3px solid var(--lane, var(--line)); border-radius: 8px; cursor: pointer;
  user-select: none; will-change: transform; touch-action: none;
  transition: border-color .15s, box-shadow .2s var(--ease), background .15s, filter .2s; }
.node:hover { border-color: var(--line2); border-top-color: var(--lane, var(--line2)); background: var(--raise2); }
.node.root { background: #212737; }
.node.root .t { font-weight: 650; }
.node.colored, .lrow.colored { background: color-mix(in srgb, var(--c) 20%, var(--raise)); border-color: color-mix(in srgb, var(--c) 70%, transparent); }
.node.colored:hover, .lrow.colored:hover { background: color-mix(in srgb, var(--c) 28%, var(--raise)); border-color: var(--c); }
.swatches { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.swatches button { width: 24px; height: 24px; padding: 0; border-radius: 6px; }
.swatches button.on { box-shadow: 0 0 0 2px var(--text); }
.swatches input[type=color] { width: 30px; height: 26px; }
.node.sel { box-shadow: 0 0 0 2px #ffffff55; }
.node.primary { box-shadow: 0 0 0 2px #fff; }
.node.hit { box-shadow: 0 0 0 2px var(--accent); }
.node.dim { filter: opacity(.28); }
.node.dragging { z-index: 10; box-shadow: 0 14px 34px #000a, 0 0 0 1px var(--line2); cursor: grabbing; transition: none; }
.node.drop-inside { box-shadow: 0 0 0 2px var(--accent), 0 0 22px #6aa9ff55; }
.node.drop-before { box-shadow: -5px 0 0 -1px var(--accent); }
.node.drop-after { box-shadow: 5px 0 0 -1px var(--accent); }
.node .meta { display: flex; align-items: center; gap: 5px; height: 15px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.node .dot, .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.node .sp { flex: 1; }
.node .crit, .crit { color: var(--warn); }
.node .t { margin-top: 2px; font-size: 12.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.node.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: #ffffff40; }
.node .rename { margin-top: 1px; height: 31px; padding: 1px 4px; resize: none; font-size: 12.5px; line-height: 1.2; }
.pill { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); height: 17px; min-width: 24px; padding: 0 6px;
  border-radius: 9px; font-size: 10.5px; line-height: 15px; background: var(--panel); border: 1px solid var(--line2); color: var(--muted); }
.pill:hover { color: var(--text); border-color: var(--muted); background: var(--panel); }
.pr { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; padding: 0 4px; border-radius: 3px; line-height: 14px; }
.p-now { color: var(--p-now); --pc: var(--p-now); } .p-next { color: var(--p-next); --pc: var(--p-next); }
.p-later { color: var(--p-later); --pc: var(--p-later); } .p-someday { color: var(--p-someday); --pc: var(--p-someday); }
.pr.p-now, .pr.p-next, .pr.p-later, .pr.p-someday { background: color-mix(in srgb, var(--pc) 16%, transparent); }
.s-idea { background: var(--idea); } .s-todo { background: var(--todo); } .s-doing { background: var(--doing); }
.s-blocked { background: var(--blocked); } .s-done { background: var(--done); }
.pulse { animation: pulse .45s var(--ease); }
@keyframes pulse { 40% { transform: scale(1.9); box-shadow: 0 0 0 4px #ffffff22; } }

#hint { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; background: var(--panel); border: 1px solid var(--line2);
  border-radius: 6px; padding: 3px 8px; font-size: 12px; opacity: 0; transition: opacity .15s; white-space: nowrap; }
#hint.show { opacity: 1; }

/* ---------- list ---------- */
#list { position: absolute; inset: 0; overflow: auto; padding: 8px 28px 120px; }
.list-in { max-width: 1040px; margin: 0 auto; }
.grp { padding-bottom: 6px; }
.grp-h { display: flex; gap: 10px; align-items: baseline; margin: 18px 0 8px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.grp-h .n { font-weight: 500; color: var(--muted); }
.grp-h .sub { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); opacity: .7; }
.lrow { display: grid; grid-template-columns: 14px 26px 10px 54px minmax(0, 1fr) minmax(0, 200px) 38px 150px; align-items: center; gap: 8px;
  padding: 7px 10px; background: var(--raise); border: 1px solid var(--line); border-left: 3px solid var(--lane, var(--line));
  border-radius: 8px; margin-bottom: 4px; cursor: pointer; user-select: none; touch-action: none;
  transition: border-color .15s, background .15s, box-shadow .2s var(--ease), opacity .2s; }
.lrow:hover { background: var(--raise2); border-color: var(--line2); border-left-color: var(--lane, var(--line2)); }
.lrow.sel { box-shadow: 0 0 0 2px #fff; }
.lrow.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: #ffffff40; }
.lrow.dragging { z-index: 5; position: relative; box-shadow: 0 12px 30px #000a; opacity: .92; transition: none; cursor: grabbing; }
.lrow .grip { color: var(--muted); cursor: grab; }
.lrow .rk { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.lrow .id { color: var(--muted); font-size: 12px; }
.lrow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .path { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .ck { color: var(--muted); font-size: 11.5px; }
.rd { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd.ready { color: var(--done); } .rd.waiting { color: var(--warn); } .rd.blocked { color: var(--bad); } .rd.done { color: var(--muted); }
.empty-grp { padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
#dropline { position: absolute; height: 2px; background: var(--accent); border-radius: 2px; pointer-events: none; display: none; box-shadow: 0 0 8px var(--accent); }

/* ---------- panel ---------- */
aside { grid-row: 3; grid-column: 2; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 14px 60px; }
body.nopanel { grid-template-columns: 1fr 0; }
body.nopanel aside { display: none; }
aside.fade > * { animation: fadeIn .2s var(--ease) both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
aside h2 { font-size: 12px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
aside label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; margin: 14px 0 5px; text-transform: uppercase; letter-spacing: .05em; }
aside label .k { text-transform: none; letter-spacing: 0; opacity: .8; }
aside label .tabs { margin-left: auto; display: flex; gap: 3px; text-transform: none; letter-spacing: 0; }
aside label .tabs button { padding: 1px 7px; font-size: 11px; }
aside textarea { min-height: 150px; resize: vertical; line-height: 1.45; }
aside .row { display: flex; gap: 8px; align-items: flex-end; }
aside .row > .grow { flex: 1; min-width: 0; }
aside .f-id { flex: 0 0 92px; }
.crumbs { color: var(--muted); font-size: 12px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg-row { display: flex; gap: 4px; flex-wrap: wrap; }
.seg-row button { display: flex; align-items: center; gap: 5px; padding: 3px 8px; }
.ready-line { margin-top: 10px; font-size: 12.5px; }
.ready-line.ready { color: var(--done); } .ready-line.waiting { color: var(--warn); } .ready-line.blocked { color: var(--bad); } .ready-line.done { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--raise); border: 1px solid var(--line); border-radius: 12px;
  padding: 1px 8px; font-size: 12px; cursor: pointer; max-width: 100%; transition: border-color .15s; }
.chip:hover { border-color: var(--line2); }
.chip b { font-weight: 500; color: var(--muted); }
.chip button { border: none; background: none; padding: 0 0 0 2px; color: var(--muted); }
.cl { display: flex; flex-direction: column; gap: 4px; }
.cli { display: flex; gap: 6px; align-items: center; }
.cli input.clt { padding: 3px 6px; }
.cli input.clt.done { color: var(--muted); text-decoration: line-through; }
.cli button { padding: 2px 7px; color: var(--muted); }
.md { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 60px; cursor: text; line-height: 1.5; }
.md p { margin: 0 0 8px; } .md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md h4, .md h5, .md h6 { margin: 8px 0 4px; font-size: 13px; }
.md pre { background: var(--raise); padding: 8px; border-radius: 6px; overflow: auto; margin: 0 0 8px; }
.md pre code { background: none; padding: 0; }
.md a { color: var(--accent); }
.md .box { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--muted); border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.md .box.on { background: var(--done); border-color: var(--done); }
.actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.actions .bad, button.bad { color: var(--bad); }
.err { color: var(--bad); font-size: 12px; min-height: 0; }
.dec { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-top: 6px; background: var(--raise); }
.dec-h { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11.5px; }
.dec-h button { margin-left: auto; border: none; background: none; padding: 0 3px; color: var(--muted); }
.dec textarea, .dec input { border: none; background: none; padding: 2px 0; min-height: 0; resize: none; }
.dec textarea { font-size: 12.5px; }
.dec input { color: var(--muted); font-size: 12px; }
.dec textarea:focus, .dec input:focus { background: var(--bg); }
details { border-bottom: 1px solid var(--line); padding: 4px 0 10px; margin-bottom: 6px; }
summary { cursor: pointer; list-style: none; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; padding: 6px 0; display: flex; gap: 8px; align-items: center; }
summary::before { content: "▸"; transition: transform .2s var(--ease); display: inline-block; }
details[open] > summary::before { transform: rotate(90deg); }
summary .k { font-weight: 400; text-transform: none; letter-spacing: 0; }
.sec { padding-top: 4px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--raise); margin: 4px 0 10px; }
.bar span { transition: width .4s var(--ease); }
.legend { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; margin-bottom: 8px; }
.act { display: grid; grid-template-columns: 48px 1fr auto; gap: 6px; padding: 3px 0; font-size: 12px; align-items: baseline; }
.act .by { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.act .by-claude { color: var(--idea); }
.act .ago { color: var(--muted); font-size: 11px; }
.lane-r { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.lane-r button { padding: 2px 8px; color: var(--muted); }
.keys td { padding: 3px 0; vertical-align: top; color: var(--muted); }
.keys td:first-child { white-space: nowrap; padding-right: 10px; color: var(--text); }

/* ---------- menu & command bar ---------- */
#menu { position: fixed; display: none; min-width: 230px; max-width: 290px; background: var(--panel); border: 1px solid var(--line2);
  border-radius: 10px; padding: 5px; box-shadow: 0 16px 44px #000b; z-index: 50; }
#menu.show { display: block; animation: pop .14s var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(-3px); } }
.mh { padding: 4px 8px 6px; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow { display: flex; gap: 3px; padding: 2px 3px 4px; }
.mrow button { flex: 1; padding: 4px 0; display: flex; justify-content: center; align-items: center; font-size: 11.5px; }
.mrow .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.mi { display: flex; width: 100%; justify-content: space-between; align-items: center; background: none; border: 1px solid transparent; padding: 5px 8px; border-radius: 6px; text-align: left; }
.mi:hover { background: var(--raise2); border-color: transparent; }
.msep { height: 1px; background: var(--line); margin: 4px 2px; }
#cmd { position: fixed; inset: 0; z-index: 70; background: #05070bb0; display: none; align-items: flex-start; justify-content: center; padding-top: 13vh; }
#cmd.show { display: flex; animation: fadeIn .15s var(--ease); }
#cmd .box { width: min(620px, 92vw); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 24px 60px #000c; overflow: hidden; }
#cmd-in { border: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 13px 16px; font-size: 15px; background: none; }
#cmd-list { max-height: 50vh; overflow: auto; padding: 5px; }
.ci { display: flex; justify-content: space-between; gap: 12px; padding: 7px 11px; border-radius: 7px; cursor: pointer; }
.ci.on { background: var(--raise2); }
.ci .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ci.tip { cursor: default; color: var(--muted); }
.cmd-foot { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body data-view="tree">
<header>
  <h1>UGH plan</h1>
  <div class="seg"><button id="v-tree" title="Tree view (V)">Tree</button><button id="v-list" title="List view (V)">List</button></div>
  <input id="search" placeholder="Filter…   /" autocomplete="off" spellcheck="false">
  <div class="grp tree-only">
    <div class="sep"></div>
    <button id="newtree" title="Start a new tree">+ Tree</button>
    <button id="tidy" title="Line trees up side by side">Tidy</button>
    <button id="fit" title="Fit everything on screen (F)">Fit</button>
    <button id="expand">Expand</button>
    <button id="collapse" title="Collapse to level 1">Collapse</button>
    <button id="deps" title="Dependency lines">Deps</button>
    <button id="lanes" title="Colour by lane">Lanes</button>
    <div class="sep"></div>
    <button id="zout" title="Zoom out">−</button>
    <button id="zreset" title="Zoom to 100%">100%</button>
    <button id="zin" title="Zoom in">+</button>
  </div>
  <div class="grp list-only">
    <div class="sep"></div>
    <button id="ready" title="Only tasks you can start right now">Ready only</button>
    <button id="hidedone">Hide done</button>
    <button id="lanes2" title="Colour by lane">Lanes</button>
  </div>
  <div class="sep"></div>
  <button id="paneltoggle" title="Show or hide the right panel (P)">Panel</button>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <button id="cmdbtn" title="Command bar">Ctrl K</button>
  <span id="save">loading…</span>
</header>
<div id="banner">
  <span>The plan changed on disk while you had unsaved edits.</span>
  <button id="takeDisk">Load disk version</button>
  <button id="keepMine">Keep mine (overwrite disk)</button>
</div>
<main id="main">
  <div id="stage">
    <div id="world"><svg id="svg" width="1" height="1"><defs>
      <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"></path></marker></defs>
      <g id="edges"></g><g id="deps-g"></g></svg></div>
    <div id="empty" hidden>No trees yet. <button id="empty-new">+ New tree</button></div>
  </div>
  <div id="list"></div>
</main>
<aside id="panel"></aside>
<div id="menu"></div>
<div id="cmd"><div class="box">
  <input id="cmd-in" placeholder="Search or type a command…" autocomplete="off" spellcheck="false">
  <div id="cmd-list"></div>
  <div class="cmd-foot">↑↓ choose · Enter run · try <code>set A2 doing</code> <code>A3 now</code> <code>add C Fan curves</code> <code>attach T1 to D</code> <code>decide …</code></div>
</div></div>
<div id="hint"></div>

<script>
"use strict";
const STATUSES = ["idea", "todo", "doing", "blocked", "done"];
const PRIOS = ["now", "next", "later", "someday"];
const PRIO_LABEL = { now: "Now", next: "Next", later: "Later", someday: "Someday" };
const GROUP_SUB = { now: "do these first", next: "after Now", later: "once the core works", someday: "maybe, eventually", none: "not ranked yet" };
const W = 156, H = 52, GX = 14, GY = 54, TREE_GAP = 90, ACTIVITY_CAP = 300;
const DUR = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 200;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ease = t => 1 - (1 - t) ** 3;
const SVG = "http://www.w3.org/2000/svg";

let plan = null, index = new Map(), mtime = null;
let rev = 0, savedRev = 0, saving = false, conflict = false, saveTimer = 0;
const sel = new Set();
let selId = null, query = "";
const undoStack = [], redoStack = [];
let lastKey = null, lastAt = 0;

// View state lives in the browser so panning/collapsing doesn't churn the plan file.
const ui = (() => {
  const d = { collapsed: [], deps: true, lanes: true, view: "tree", zoom: 1, panX: 60, panY: 60, readyOnly: false, hideDone: false,
    notes: "edit", open: { progress: true, decisions: true, activity: true, lanes: false, keys: false }, seeded: false, fitted: false };
  try { Object.assign(d, JSON.parse(localStorage.getItem("dendo-ugh2") || "{}")); } catch {}
  d.collapsed = new Set(d.collapsed);

})();
function saveUi() { try { localStorage.setItem("dendo-ugh2", JSON.stringify({ ...ui, collapsed: [...ui.collapsed] })); } catch {} }
let uiTimer = 0;
function saveUiSoon() { clearTimeout(uiTimer); uiTimer = setTimeout(saveUi, 300); }

// ---------- model ----------

function reindex() {
  index = new Map();
  let order = 0;
  for (const t of plan.trees) (function walk(n, parent, depth) {
    n.children ||= []; n.deps ||= []; n.checklist ||= [];
    index.set(n.id, { node: n, parent, root: t, depth, order: order++ });
    n.children.forEach(c => walk(c, n, depth + 1));
  })(t, null, 0);
}
const nodeOf = id => index.get(id)?.node;
const resolveId = s => s && (index.has(s) ? s : [...index.keys()].find(k => k.toLowerCase() === s.toLowerCase()));
const laneById = id => (plan.lanes || []).find(l => l.id === id);

function laneColor(id) {
  for (let e = index.get(id); e; e = e.parent && index.get(e.parent.id))
    if (e.node.lane) return laneById(e.node.lane)?.color || null;
  return null;
}
function inheritedLane(id) {
  for (let p = index.get(id)?.parent; p; p = index.get(p.id).parent) if (p.lane) return laneById(p.lane);
  return null;
}
// true when a is an ancestor of b
function isAncestor(a, b) {
  for (let e = index.get(b); e?.parent; e = index.get(e.parent.id)) if (e.parent.id === a) return true;
  return false;
}
function pathOf(id) {
  const out = [];
  for (let p = index.get(id)?.parent; p; p = index.get(p.id).parent) out.unshift(p);
  return out;
}
function isDone(n) { return n.status === "done" || (n.children.length > 0 && n.children.every(isDone)); }
function readiness(n) {
  if (isDone(n)) return { kind: "done", waits: [] };
  if (n.status === "blocked") return { kind: "blocked", waits: [] };
  // A parent's dependencies hold for everything under it.
  const deps = [...n.deps];
  for (const a of pathOf(n.id)) for (const d of a.deps) if (!deps.includes(d)) deps.push(d);
  const waits = deps.filter(d => index.has(d) && !isDone(nodeOf(d)));
  return { kind: waits.length ? "waiting" : "ready", waits };
}
const readyText = r => ({ ready: "✓ Ready to start", done: "✓ Done", blocked: "⛔ Blocked" })[r.kind] || `⏳ Waiting on ${r.waits.join(", ")}`;
const readyShort = r => ({ ready: "✓ ready", done: "✓ done", blocked: "⛔ blocked" })[r.kind]
  || `⏳ ${r.waits.slice(0, 3).join(", ")}${r.waits.length > 3 ? "…" : ""}`;
const isTask = n => !n.children.length || !!n.priority;
const tasks = () => [...index.values()].map(e => e.node).filter(isTask);
const byRank = (a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9) || index.get(a.id).order - index.get(b.id).order;
const countDesc = n => n.children.reduce((s, c) => s + 1 + countDesc(c), 0);
function matches(n) {
  const hay = (n.id + " " + n.title + " " + (n.notes || "")).toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
const blank = (id, title = "New node") => ({ id, title, status: "todo", color: null, lane: null, critical: false, priority: null, rank: null,
  deps: [], notes: "", checklist: [], children: [] });

// Must match Plan.new_id() in dendo-ugh.
function newId(parent) {
  if (!parent) { for (let i = 1; ; i++) if (!index.has("T" + i)) return "T" + i; }
  if (!index.get(parent.id).parent && !/\d/.test(parent.id) && parent.children.every(c => c.id.length === 1))
    for (const c of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") if (!index.has(c)) return c;
  const sep = /^[A-Za-z]$/.test(parent.id) ? "" : ".";
  for (let i = 1; ; i++) if (!index.has(parent.id + sep + i)) return parent.id + sep + i;
}

function logAct(text) {
  const a = (plan.activity ||= []);
  a.push({ at: new Date().toISOString(), by: "user", text });
  if (a.length > ACTIVITY_CAP) a.splice(0, a.length - ACTIVITY_CAP);
}
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!(s >= 0)) return "";
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

// ---------- edits, undo, save ----------

function mutate(fn, { key = null, panel = true } = {}) {
  const now = Date.now();
  if (!(key && key === lastKey && now - lastAt < 1500)) {
    undoStack.push(JSON.stringify(plan));
    if (undoStack.length > 200) undoStack.shift();
  }
  lastKey = key; lastAt = now;
  redoStack.length = 0;
  fn();
  changed(panel);
}
function changed(panel = true) {
  reindex();
  for (const id of [...sel]) if (!index.has(id)) sel.delete(id);
  if (selId && !index.has(selId)) selId = [...sel].at(-1) ?? null;
  rev++;
  render(panel);
  scheduleSave();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(plan));
  plan = JSON.parse(undoStack.pop());
  lastKey = null;
  changed();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(plan));
  plan = JSON.parse(redoStack.pop());
  lastKey = null;
  changed();
}
function scheduleSave() {
  setSave("unsaved", "warn");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
}
async function save() {
  if (conflict) return;
  if (saving) { scheduleSave(); return; }
  saving = true;
  const r0 = rev;
  try {
    plan.updated = new Date().toISOString();
    const r = await fetch("/api/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Dendo": "1" },
      body: JSON.stringify({ base: mtime, plan }),
    });
    const j = await r.json();
    if (r.status === 409) { showConflict(); return; }
    if (!r.ok) throw new Error(j.error || r.status);
    mtime = j.mtime;
    savedRev = r0;
    if (rev === savedRev) setSave("saved");
  } catch (e) {
    setSave("save failed: " + e.message, "bad");
  } finally {
    saving = false;
  }
}
async function load() {
  const j = await (await fetch("/api/plan")).json();
  plan = j.plan; mtime = j.mtime;
  undoStack.length = 0; redoStack.length = 0;
  reindex();
  rev = savedRev = 0; conflict = false;
  $("#banner").classList.remove("show");
  if (!ui.seeded) {
    for (const t of plan.trees) t.children.forEach(c => c.children.length && ui.collapsed.add(c.id));
    ui.seeded = true; saveUi();
  }
  for (const id of [...sel]) if (!index.has(id)) sel.delete(id);
  if (selId && !index.has(selId)) selId = [...sel].at(-1) ?? null;
  for (const id of [...ui.collapsed]) if (!index.has(id)) ui.collapsed.delete(id);
  render();
  if (!ui.fitted) { fit(false, 0.8); ui.fitted = true; saveUi(); } else applyView();
  setSave("saved");
}
function showConflict() {
  conflict = true;
  $("#banner").classList.add("show");
  setSave("conflict", "bad");
}
function setSave(text, cls = "") {
  const el = $("#save");
  el.textContent = text;
  el.className = cls;
}

// Picks up edits made to dendro.json outside the page (CLI, agents, editors).
setInterval(async () => {
  if (saving || !plan) return;
  const base = mtime;
  try {
    const j = await (await fetch("/api/mtime")).json();
    // A save that finished while we were asking already moved mtime on; that isn't an outside edit.
    if (saving || mtime !== base || j.mtime === mtime) return;
    if (rev === savedRev) load();
    else if (!conflict) showConflict();
  } catch {
    setSave("server offline", "bad");
  }
}, 2000);

// ---------- tree operations ----------

function detachRaw(e) {
  const list = e.parent ? e.parent.children : plan.trees;
  list.splice(list.indexOf(e.node), 1);
}
function addChild(id, title) {
  const p = nodeOf(id);
  if (!p) return;
  const n = blank(newId(p), title || "New node");
  ui.collapsed.delete(p.id); saveUi();
  mutate(() => { p.children.push(n); logAct(`added ${n.id} under ${p.id}`); });
  select(n.id, { rename: !title });
}
function addSibling(id, title) {
  const e = index.get(id);
  if (!e) return;
  if (!e.parent) return addChild(id, title);
  const n = blank(newId(e.parent), title || "New node");
  mutate(() => { e.parent.children.splice(e.parent.children.indexOf(e.node) + 1, 0, n); logAct(`added ${n.id} under ${e.parent.id}`); });
  select(n.id, { rename: !title });
}
function newTree(title, at) {
  const n = blank(newId(null), title || "New tree");
  if (at) n.pos = at;
  mutate(() => { plan.trees.push(n); logAct(`new tree ${n.id}`); });
  if (ui.view !== "tree") setView("tree");
  select(n.id, { rename: !title });
}
function deleteNodes(ids) {
  ids = ids.filter(id => index.has(id) && !ids.some(o => o !== id && isAncestor(o, id)));

  for (const id of ids) (function w(n) { gone.add(n.id); n.children.forEach(w); })(nodeOf(id));
  let next = null;
  if (ids.length === 1) {
    const e = index.get(ids[0]), sib = e.parent ? e.parent.children : plan.trees, i = sib.indexOf(e.node);
    next = (sib[i + 1] || sib[i - 1] || e.parent)?.id ?? null;
  }
  mutate(() => {
    for (const id of ids) detachRaw(index.get(id));
    index.forEach(({ node }) => { node.deps = node.deps.filter(d => !gone.has(d)); });
    (plan.decisions || []).forEach(d => { if (gone.has(d.node)) d.node = null; });
    logAct(`deleted ${ids.join(", ")}${gone.size > ids.length ? ` (+${gone.size - ids.length} inside)` : ""}`);
  });

}
function moveNode(src, tgt, zone) {
  if (src === tgt || isAncestor(src, tgt) || !index.has(src) || !index.has(tgt)) return;
  const s = index.get(src), t = index.get(tgt);
  if (zone !== "inside" && !t.parent) zone = "inside";
  if (zone === "inside") { ui.collapsed.delete(tgt); saveUi(); }
  mutate(() => {
    detachRaw(s);
    delete s.node.pos;
    if (zone === "inside") t.node.children.push(s.node);
    else { const sib = t.parent.children; sib.splice(sib.indexOf(t.node) + (zone === "after" ? 1 : 0), 0, s.node); }
    logAct(zone === "inside" ? `${s.parent ? "moved" : "attached tree"} ${src} under ${tgt}` : `moved ${src} ${zone} ${tgt}`);
  });
}
function detach(id, at) {
  const e = index.get(id);
  if (!e?.parent) return;
  mutate(() => {
    detachRaw(e);
    if (at) e.node.pos = at; else delete e.node.pos;
    plan.trees.push(e.node);
    logAct(`detached ${id} into its own tree`);
  });

}
function renameId(oldId, nid) {
  const el = els.get(oldId);
  if (el) {
    els.delete(oldId); els.set(nid, el); el.dataset.id = nid;
    cur.set(nid, cur.get(oldId)); cur.delete(oldId);
    const ed = edgeEls.get(oldId);
    if (ed) { edgeEls.delete(oldId); edgeEls.set(nid, ed); }
  }
  if (ui.collapsed.delete(oldId)) ui.collapsed.add(nid);
  if (sel.delete(oldId)) sel.add(nid);
  if (selId === oldId) selId = nid;
  saveUi();
  mutate(() => {
    nodeOf(oldId).id = nid;
    index.forEach(({ node }) => { node.deps = node.deps.map(d => d === oldId ? nid : d); });
    (plan.decisions || []).forEach(d => { if (d.node === oldId) d.node = nid; });
    logAct(`renamed id ${oldId} → ${nid}`);

}
function nextRank(p) { return Math.max(0, ...tasks().filter(n => n.priority === p && n.rank != null).map(n => n.rank)) + 1; }
function renumber(p) { tasks().filter(n => n.priority === p).sort(byRank).forEach((n, i) => { n.rank = i + 1; }); }
function setStatus(ids, s) {
  ids = ids.filter(id => nodeOf(id) && nodeOf(id).status !== s);
  if (!ids.length) return;
  mutate(() => { ids.forEach(id => { nodeOf(id).status = s; }); logAct(`${ids.join(", ")} → ${s}`); });
}

  ids = ids.filter(id => nodeOf(id) && (nodeOf(id).priority || null) !== p);
  if (!ids.length) return;
  mutate(() => {
    const olds = new Set();
    ids.forEach(id => { const n = nodeOf(id); if (n.priority) olds.add(n.priority); n.priority = p; n.rank = p ? nextRank(p) : null; });
    olds.forEach(renumber);

function setLane(ids, lane) { mutate(() => { ids.forEach(id => { nodeOf(id).lane = lane; }); }); }
function setColor(ids, color, key = null) { mutate(() => { ids.forEach(id => { nodeOf(id).color = color; }); }, { key, panel: !key }); }
function toggleCrit(ids) {
  const on = ids.some(id => !nodeOf(id).critical);
  mutate(() => { ids.forEach(id => { nodeOf(id).critical = on; }); });
}
function addDecision(text, why = "", node = null) {
  mutate(() => {
    const ds = (plan.decisions ||= []);
    let i = 1;
    while (ds.some(d => d.id === "D" + i)) i++;
    ds.push({ id: "D" + i, date: today(), text, why, node });
    logAct(`decided: ${text.slice(0, 80)}`);

}
function toggle(id) {
  if (!nodeOf(id)?.children.length) return;
  ui.collapsed.has(id) ? ui.collapsed.delete(id) : ui.collapsed.add(id);
  saveUi(); render(false);
}
function expandAll() { ui.collapsed.clear(); saveUi(); render(false); }
function collapseAll() {
  ui.collapsed = new Set([...index.values()].filter(e => e.depth === 1 && e.node.children.length).map(e => e.node.id));
  saveUi(); render(false);

// ---------- selection & view ----------

function select(id, { reveal: rv = true, rename = false } = {}) {
  sel.clear();
  selId = id && index.has(id) ? id : null;
  if (selId) {
    sel.add(selId);
    for (let p = index.get(selId).parent; p; p = index.get(p.id).parent) ui.collapsed.delete(p.id);
    saveUi();
  }
  render();
  if (selId && rv) reveal(selId);
  if (selId && rename) startRename(selId);
}
function toggleSel(id) {
  if (sel.has(id)) { sel.delete(id); if (selId === id) selId = [...sel].at(-1) ?? null; }
  else { sel.add(id); selId = id; }
  render();
}
function setView(v) {
  ui.view = v; saveUi();
  render();
  if (v === "tree") applyView();
}
function render(panel = true) {
  document.body.dataset.view = ui.view;
  if (ui.view === "tree") renderTree(); else renderList();
  if (panel) renderPanel();
  toolbar();
}
function toolbar() {
  document.body.classList.toggle("nopanel", ui.panel === false);
  $("#paneltoggle").classList.toggle("on", ui.panel !== false);
  $("#v-tree").classList.toggle("on", ui.view === "tree");
  $("#v-list").classList.toggle("on", ui.view === "list");
  $("#deps").classList.toggle("on", ui.deps);
  $("#lanes").classList.toggle("on", ui.lanes);
  $("#lanes2").classList.toggle("on", ui.lanes);
  $("#ready").classList.toggle("on", ui.readyOnly);
  $("#hidedone").classList.toggle("on", ui.hideDone);
  $("#undo").disabled = !undoStack.length;
  $("#redo").disabled = !redoStack.length;
  $("#zreset").textContent = Math.round(ui.zoom * 100) + "%";
}

// ---------- tree layout & animation ----------

// Top-down tidy layout. Each tree is anchored by its root's top-left (tree.pos);
// trees without a pos are placed to the right of everything else.
function layout() {
  const pos = new Map(), open = n => !!query || !ui.collapsed.has(n.id), pending = [];
  let right = null;
  for (const t of plan.trees) {
    const local = new Map();
    let slot = 0;
    (function place(n, d) {
      const kids = open(n) ? n.children : [];
      let x;
      if (!kids.length) x = slot++ * (W + GX);
      else { kids.forEach(c => place(c, d + 1)); x = (local.get(kids[0].id).x + local.get(kids.at(-1).id).x) / 2; }
      local.set(n.id, { x, y: d * (H + GY) });
    })(t, 0);
    const xs = [...local.values()].map(p => p.x), r = local.get(t.id);
    const box = { t, local, r, minX: Math.min(...xs), maxX: Math.max(...xs) + W };
    if (!t.pos) { pending.push(box); continue; }
    const dx = t.pos.x - r.x, dy = t.pos.y - r.y;
    for (const [id, p] of local) pos.set(id, { x: p.x + dx, y: p.y + dy });
    right = Math.max(right ?? -Infinity, box.maxX + dx);
  }
  for (const { t, local, r, minX, maxX } of pending) {
    const x0 = right == null ? 0 : right + TREE_GAP;
    t.pos = { x: Math.round(x0 + r.x - minX), y: 0 };
    const dx = t.pos.x - r.x;
    for (const [id, p] of local) pos.set(id, { x: p.x + dx, y: p.y });
    right = x0 + maxX - minX;
  }
  return pos;
}

const els = new Map(), cur = new Map(), edgeEls = new Map(), depEls = new Map(), dying = new Set();
let from = new Map(), to = new Map(), animStart = 0, raf = 0, depList = [], drag = null;

function liveAnc(id, pos) {
  for (let e = index.get(id); e; e = e.parent && index.get(e.parent.id)) if (pos.has(e.node.id)) return e.node.id;
  return null;
}
function renderTree() {
  const pos = layout(), world = $("#world");
  for (const [id, p] of pos) {
    const e = index.get(id);
    let el = els.get(id);
    if (!el) {
      el = document.createElement("div");
      el.className = "node";
      el.dataset.id = id;
      el.addEventListener("pointerdown", onNodeDown);
      el.addEventListener("dblclick", onNodeDbl);
      el.addEventListener("contextmenu", onNodeMenu);
      world.append(el);
      els.set(id, el);
      // New nodes grow out of their parent.
      const pc = e.parent && (cur.get(e.parent.id) || pos.get(e.parent.id));
      cur.set(id, pc ? { x: pc.x, y: pc.y, o: 0 } : { x: p.x, y: p.y + 14, o: 0 });
    }
    dying.delete(id);
    paintNode(el, e);
  }
  for (const id of els.keys()) if (!pos.has(id)) dying.add(id);
  to = new Map();
  for (const [id, p] of pos) to.set(id, { x: p.x, y: p.y, o: 1 });
  // Hidden nodes shrink back into whichever ancestor is still visible.
  for (const id of dying) {
    const anc = liveAnc(id, pos), c = cur.get(id);
    to.set(id, anc ? { ...pos.get(anc), o: 0 } : { ...c, o: 0 });
  }
  syncEdges();
  syncDeps(pos);
  from = new Map([...cur].map(([k, v]) => [k, { ...v }]));
  animStart = performance.now();
  if (!raf) raf = requestAnimationFrame(tick);
  $("#empty").hidden = plan.trees.length > 0;
}
function nodeInner(n) {

  const ck = n.checklist.length ? `<span>${n.checklist.filter(c => c.done).length}/${n.checklist.length}</span>` : "";
  return `<div class="meta"><span class="dot s-${esc(n.status)}"></span><span>${esc(n.id)}</span>` +
    (n.critical ? `<span class="crit">★</span>` : "") + `<span class="sp"></span>${ck}` +
    (n.priority ? `<span class="pr p-${esc(n.priority)}">${PRIO_LABEL[n.priority]}</span>` : "") + `</div>` +
    `<div class="t">${esc(n.title)}</div>` +
    (n.children.length ? `<button class="pill" tabindex="-1">${hidden ? "+" + countDesc(n) : "−"}</button>` : "");

function syncDeps(pos) {

function md(src) {
  if (!src || !src.trim()) return "";
  const inline = s => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = [];
  let list = null, code = null, para = [];
  const endPara = () => { if (para.length) { out.push(`<p>${inline(para.join("<br>"))}</p>`); para = []; } };
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const item = (tag, html) => { endPara(); if (list !== tag) { endList(); out.push(`<${tag}>`); list = tag; } out.push(`<li>${html}</li>`); };
  for (const line of esc(src).split("\n")) {
    if (code !== null) {
      if (/^\s*```/.test(line)) { out.push(`<pre><code>${code}</code></pre>`); code = null; } else code += line + "\n";
      continue;
    }
    let m;
    if (/^\s*```/.test(line)) { endPara(); endList(); code = ""; }
    else if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { endPara(); endList(); const h = m[1].length + 3; out.push(`<h${h}>${inline(m[2])}</h${h}>`); }
    else if ((m = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/))) item("ul", `<span class="box${m[1] === " " ? "" : " on"}"></span>${inline(m[2])}`);
    else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) item("ul", inline(m[1]));
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) item("ol", inline(m[1]));
    else if (!line.trim()) { endPara(); endList(); }
    else { endList(); para.push(line); }
  }
  if (code !== null) out.push(`<pre><code>${code}</code></pre>`);
  endPara(); endList();
  return out.join("");
}

    sec("lanes", "Lanes", (plan.lanes || []).map(l =>
      `<div class="lane-r"><input type="color" data-f="lane-color" data-l="${esc(l.id)}" value="${esc(l.color)}"><input data-f="lane-name" data-l="${esc(l.id)}" value="${esc(l.name)}">` +
      `<button data-act="lane-del" data-v="${esc(l.id)}" title="Delete lane">×</button></div>`).join("") + `<button data-act="lane-add">+ lane</button>`) +
    sec("keys", "Shortcuts", `<table class="keys">${keys.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>
      <p class="muted">Saves to <code>plan/dendro.json</code> automatically. Changes made in the terminal show up here within 2 s.</p>`);
}

const panel = $("#panel");
panel.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const v = b.dataset.v, n = sel.size === 1 ? nodeOf(selId) : null, ids = [...sel];
  switch (b.dataset.act) {
    case "status": setStatus(ids, v); break;
    case "prio": setPrio(ids, v); break;
    case "crit": toggleCrit(ids); break;
    case "child": addChild(selId); break;
    case "sibling": addSibling(selId); break;
    case "detach": detach(selId); break;
    case "color": setColor(ids, v || null); break;
    case "delete": deleteNodes(ids); break;
    case "go": select(v); break;
    case "clear-sel": select(null); break;
    case "rmdep": mutate(() => { n.deps = n.deps.filter(d => d !== v); logAct(`${n.id} no longer depends on ${v}`); }); break;
    case "clx": mutate(() => { n.checklist.splice(+v, 1); }); break;
    case "notes-mode":
      ui.notes = v; saveUi(); renderPanel();
      if (v === "edit") $('[data-f="notes"]', panel)?.focus();
      break;
    case "dec-del": mutate(() => { plan.decisions.splice(+v, 1); }); break;
    case "lane-add": mutate(() => {
      let i = 1;
      while (plan.lanes.some(l => l.id === "lane" + i)) i++;
      plan.lanes.push({ id: "lane" + i, name: "New lane", color: "#7dd3fc" });
    }); break;
    case "lane-del": mutate(() => {
      plan.lanes = plan.lanes.filter(l => l.id !== v);
      index.forEach(({ node }) => { if (node.lane === v) node.lane = null; });
    }); break;
  }
});
panel.addEventListener("input", e => {
  const f = e.target.dataset.f, v = e.target.value, i = +e.target.dataset.i, n = nodeOf(selId);
  const quiet = (key, fn) => mutate(fn, { key, panel: false });
  if (f === "title") quiet("title:" + n.id, () => { n.title = v; });
  else if (f === "notes") quiet("notes:" + n.id, () => { n.notes = v; });
  else if (f === "cl-text") quiet(`cl:${n.id}:${i}`, () => { n.checklist[i].text = v; });
  else if (f === "dec-text") quiet("dt" + i, () => { plan.decisions[i].text = v; });
  else if (f === "dec-why") quiet("dw" + i, () => { plan.decisions[i].why = v; });
  else if (f === "color") setColor([...sel], v, "color:" + [...sel].join());
  else if (f === "lane-name") quiet("ln" + e.target.dataset.l, () => { laneById(e.target.dataset.l).name = v; });
  else if (f === "lane-color") quiet("lc" + e.target.dataset.l, () => { laneById(e.target.dataset.l).color = v; });
});
panel.addEventListener("change", e => {
  const f = e.target.dataset.f, v = e.target.value, n = nodeOf(selId);
  if (f === "id") {
    const nid = v.trim();
    if (nid === n.id) return;
    if (!/^[A-Za-z0-9._-]+$/.test(nid)) { $("#f-err").textContent = "Id can only use letters, digits, . _ -"; return; }
    if (index.has(nid)) { $("#f-err").textContent = `Id “${nid}” is already taken`; return; }
    renameId(n.id, nid);
  }
  else if (f === "lane") mutate(() => { n.lane = v || null; });
  else if (f === "bulk-lane") { if (v !== "__") setLane([...sel], v || null); }
  else if (f === "adddep" && v) mutate(() => { n.deps.push(v); logAct(`${n.id} now depends on ${v}`); });
  else if (f === "attach" && v) moveNode(n.id, v, "inside");
  else if (f === "cl-done") mutate(() => { n.checklist[+e.target.dataset.i].done = e.target.checked; });
});
panel.addEventListener("keydown", e => {
  const f = e.target.dataset.f, v = e.target.value?.trim();
  if (e.key !== "Enter" || e.shiftKey) return;
  if (f === "cl-add" && v) { mutate(() => { nodeOf(selId).checklist.push({ text: v, done: false }); }); $('[data-f="cl-add"]', panel)?.focus(); }
  else if (f === "dec-new" && v) { addDecision(v, "", sel.size === 1 ? selId : null); $('[data-f="dec-new"]', panel)?.focus(); }
  else if (f === "title" || f === "id" || f === "cl-text" || f === "dec-why") { e.preventDefault(); e.target.blur(); }
});
panel.addEventListener("toggle", e => {
  const k = e.target.dataset?.sec;
  if (k) { ui.open[k] = e.target.open; saveUi(); }
}, true);

// ---------- toolbar & keys ----------

$("#v-tree").addEventListener("click", () => setView("tree"));
$("#v-list").addEventListener("click", () => setView("list"));
$("#search").addEventListener("input", e => { query = e.target.value.trim(); render(false); });
$("#newtree").addEventListener("click", () => newTree());
$("#empty-new").addEventListener("click", () => newTree());
$("#tidy").addEventListener("click", tidy);
$("#fit").addEventListener("click", () => fit());
$("#expand").addEventListener("click", expandAll);
$("#collapse").addEventListener("click", collapseAll);
$("#deps").addEventListener("click", () => { ui.deps = !ui.deps; saveUi(); render(false); });
for (const b of ["#lanes", "#lanes2"]) $(b).addEventListener("click", () => { ui.lanes = !ui.lanes; saveUi(); render(false); });
$("#ready").addEventListener("click", () => { ui.readyOnly = !ui.readyOnly; saveUi(); render(false); });
$("#hidedone").addEventListener("click", () => { ui.hideDone = !ui.hideDone; saveUi(); render(false); });
$("#zin").addEventListener("click", () => zoomCenter(1.2));
$("#zout").addEventListener("click", () => zoomCenter(1 / 1.2));
$("#zreset").addEventListener("click", () => zoomCenter(1 / ui.zoom));
$("#undo").addEventListener("click", undo);
$("#redo").addEventListener("click", redo);
$("#cmdbtn").addEventListener("click", () => openCmd());
function togglePanel() { ui.panel = ui.panel === false; saveUi(); toolbar(); if (ui.view === "tree") applyView(); }
$("#paneltoggle").addEventListener("click", togglePanel);
$("#takeDisk").addEventListener("click", load);
$("#keepMine").addEventListener("click", async () => {
  mtime = (await (await fetch("/api/mtime")).json()).mtime;
  conflict = false;
  $("#banner").classList.remove("show");
  save();
});
// Keep keyboard shortcuts from re-triggering whichever button was clicked last.
document.addEventListener("click", e => { const b = e.target.closest("button"); if (b && !b.closest("#cmd")) b.blur(); });

document.addEventListener("keydown", e => {
  if ($("#cmd").classList.contains("show")) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); return; }
  if (e.key === "Escape") {
    if (drag) { endDrag(true); return; }
    if (menuOpen) { closeMenu(); return; }
    if (typing) { document.activeElement.blur(); return; }
    if (query) { query = ""; $("#search").value = ""; render(false); return; }
    if (sel.size) select(null, { reveal: false });
    return;
  }
  if (typing) return;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (mod || (e.altKey && !e.key.startsWith("Arrow"))) return;
  if (e.key === "/") { e.preventDefault(); $("#search").focus(); return; }
  if (e.key === "v" || e.key === "V") { setView(ui.view === "tree" ? "list" : "tree"); return; }
  if (e.key === "p" || e.key === "P") { togglePanel(); return; }
  if ((e.key === "f" || e.key === "F") && ui.view === "tree") { fit(); return; }
  if (ui.view === "list" && !selId && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); listStep(1); return; }
  if (!selId) return;
  const ids = [...sel], dm = e.code.match(/^Digit(\d)$/);
  if (dm && !e.shiftKey && +dm[1] >= 1 && +dm[1] <= 5) { setStatus(ids, STATUSES[+dm[1] - 1]); return; }
  if (dm && e.shiftKey && +dm[1] <= 4) { e.preventDefault(); setPrio(ids, +dm[1] ? PRIOS[+dm[1] - 1] : null); return; }
  const ent = index.get(selId), sibs = ent.parent ? ent.parent.children : plan.trees, i = sibs.indexOf(ent.node);
  const keys = {
    Tab: () => addChild(selId),
    Enter: () => addSibling(selId),
    Delete: () => deleteNodes(ids),
    Backspace: () => deleteNodes(ids),
    " ": () => toggle(selId),
    F2: () => select(selId, { rename: true }),
  };
  if (ui.view === "tree") Object.assign(keys, {
    ArrowUp: () => ent.parent && select(ent.parent.id),
    ArrowDown: () => { if (ent.node.children.length) { ui.collapsed.delete(selId); select(ent.node.children[0].id); } },
    ArrowLeft: () => i > 0 && select(sibs[i - 1].id),
    ArrowRight: () => i < sibs.length - 1 && select(sibs[i + 1].id),
  });
  else Object.assign(keys, {
    ArrowUp: () => e.altKey ? listNudge(selId, -1) : listStep(-1),
    ArrowDown: () => e.altKey ? listNudge(selId, 1) : listStep(1),
  });
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});

window.addEventListener("beforeunload", e => { if (rev !== savedRev) e.preventDefault(); });
window.addEventListener("resize", () => { if (ui.view === "tree") applyView(); });

load().catch(e => setSave("load failed: " + e.message, "bad"));
</script>
